<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temple Setup | YatraSetu</title>

    <link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>

<body>

    <div class="setup-page">

        <div class="setup-card">

            <div class="brand">
                <div class="brand-logo">ॐ</div>

                <div>
                    <h2>YatraSetu</h2>
                    <span>Safe • Secure • Smart</span>
                </div>
            </div>

            <div class="setup-header">

                <span class="setup-badge">
                    TEMPLE REGISTRATION
                </span>

                <h1>Set up your temple</h1>

                <p>
                    Enter your temple information to configure
                    YatraSetu for your organisation.
                </p>

            </div>


            <form id="templeForm">

                <div class="form-section">

                    <h3>Temple Information</h3>

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="templeName">
                                Temple Name
                            </label>

                            <input
                                type="text"
                                id="templeName"
                                placeholder="Enter temple name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="location">
                                Location
                            </label>

                            <input
                                type="text"
                                id="location"
                                placeholder="City, State"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            placeholder="Brief description of the temple"
                            rows="4"
                        ></textarea>

                    </div>

                </div>


                <div class="form-section">

                    <h3>Temple Timings</h3>

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="openingTime">
                                Opening Time
                            </label>

                            <input
                                type="time"
                                id="openingTime"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="closingTime">
                                Closing Time
                            </label>

                            <input
                                type="time"
                                id="closingTime"
                                required
                            >

                        </div>

                    </div>

                </div>


                <div class="form-section">

                    <h3>Temple Administrator</h3>

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="adminName">
                                Admin Name
                            </label>

                            <input
                                type="text"
                                id="adminName"
                                placeholder="Enter administrator name"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="adminEmail">
                                Admin Email
                            </label>

                            <input
                                type="email"
                                id="adminEmail"
                                placeholder="admin@example.com"
                                required
                            >

                        </div>

                    </div>

                    <div class="form-group">

                        <label for="adminPassword">
                            Temporary Password
                        </label>

                        <input
                            type="password"
                            id="adminPassword"
                            minlength="6"
                            placeholder="Minimum 6 characters"
                            required
                        >

                    </div>

                </div>


                <div class="form-section">

                    <h3>Contact Information</h3>

                    <div class="form-group">

                        <label for="contact">
                            Contact Number
                        </label>

                        <input
                            type="tel"
                            id="contact"
                            placeholder="Enter contact number"
                            required
                        >

                    </div>

                </div>


                <div
                    id="formMessage"
                    class="form-message"
                ></div>


                <button
                    type="submit"
                    class="setup-btn"
                >
                    Create Temple
                    <span>→</span>
                </button>

            </form>

        </div>

    </div>


<script>

const API_URL = "";

const form = document.getElementById("templeForm");
const message = document.getElementById("formMessage");

async function getSession() {
    if (typeof supabaseClient === "undefined") {
        throw new Error("Supabase configuration is missing.");
    }

    const { data: { session }, error } =
        await supabaseClient.auth.getSession();

    if (error || !session?.access_token) {
        throw new Error("Authorization token required. Please login again.");
    }

    return session;
}

function setMessage(text, success = false) {
    message.textContent = text;
    message.classList.toggle("success", success);
}

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const name = document.getElementById("templeName").value.trim();
    const location = document.getElementById("location").value.trim();
    const description = document.getElementById("description").value.trim();
    const opening_time = document.getElementById("openingTime").value;
    const closing_time = document.getElementById("closingTime").value;
    const contact = document.getElementById("contact").value.trim();

    const admin_name = document.getElementById("adminName").value.trim();
    const admin_email = document.getElementById("adminEmail").value.trim();
    const admin_password = document.getElementById("adminPassword").value;

    if (!name || !location || !opening_time || !closing_time || !contact ||
        !admin_name || !admin_email || admin_password.length < 6) {
        setMessage("Please fill all required fields. Password must be at least 6 characters.");
        return;
    }

    setMessage("Creating temple and Temple Admin...");

    try {

        const session = await getSession();

        const params = new URLSearchParams({
            name,
            location,
            description,
            opening_time,
            closing_time,
            contact,
            admin_name,
            admin_email,
            admin_password
        });

        const response = await fetch(
            `${API_URL}/api/admin/create-temple?${params.toString()}`,
            {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${session.access_token}`
                }
            }
        );

        let data = {};
        try {
            data = await response.json();
        } catch (_) {
            data = {};
        }

        if (!response.ok) {
            throw new Error(
                data.detail || `Failed to create temple (${response.status})`
            );
        }

        localStorage.setItem(
            "yatrasetu_temple_id",
            String(data.temple_id)
        );

        setMessage(
            `✓ Temple and Temple Admin created successfully. Temple ID: ${data.temple_id}`,
            true
        );

        setTimeout(() => {
            window.location.href =
                `zone-setup.html?temple_id=${encodeURIComponent(data.temple_id)}&mode=super`;
        }, 1200);

    } catch (error) {

        console.error("Temple creation error:", error);

        setMessage(
            error.message || "Unable to create temple."
        );
    }
});

</script>

    <footer class="site-footer">Made by <strong>Yash@Xalien</strong></footer>

</body>

</html>
