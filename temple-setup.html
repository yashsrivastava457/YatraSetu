<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temple Setup | YatraSetu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="setup-page">

        <div class="setup-card">

            <div class="brand">
                <div class="brand-logo">ॐ</div>

                <div>
                    <h2>YatraSetu</h2>
                    <span>Safe • Secure • Smart</span>
                </div>
            </div>

            <div class="setup-header">

                <span class="setup-badge">
                    TEMPLE REGISTRATION
                </span>

                <h1>Set up your temple</h1>

                <p>
                    Enter your temple information to configure
                    YatraSetu for your organisation.
                </p>

            </div>


            <form id="templeForm">

                <div class="form-section">

                    <h3>Temple Information</h3>

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="templeName">
                                Temple Name
                            </label>

                            <input
                                type="text"
                                id="templeName"
                                placeholder="Enter temple name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="location">
                                Location
                            </label>

                            <input
                                type="text"
                                id="location"
                                placeholder="City, State"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            placeholder="Brief description of the temple"
                            rows="4"
                        ></textarea>

                    </div>

                </div>


                <div class="form-section">

                    <h3>Temple Timings</h3>

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="openingTime">
                                Opening Time
                            </label>

                            <input
                                type="time"
                                id="openingTime"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="closingTime">
                                Closing Time
                            </label>

                            <input
                                type="time"
                                id="closingTime"
                                required
                            >

                        </div>

                    </div>

                </div>


                <div class="form-section">

                    <h3>Contact Information</h3>

                    <div class="form-group">

                        <label for="contact">
                            Contact Number
                        </label>

                        <input
                            type="tel"
                            id="contact"
                            placeholder="Enter contact number"
                            required
                        >

                    </div>

                </div>


                <div
                    id="formMessage"
                    class="form-message"
                ></div>


                <button
                    type="submit"
                    class="setup-btn"
                >
                    Create Temple
                    <span>→</span>
                </button>

            </form>

        </div>

    </div>


<script>

const API_URL = "";

const form = document.getElementById("templeForm");
const message = document.getElementById("formMessage");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const name =
        document.getElementById("templeName").value.trim();

    const location =
        document.getElementById("location").value.trim();

    const description =
        document.getElementById("description").value.trim();

    const opening_time =
        document.getElementById("openingTime").value;

    const closing_time =
        document.getElementById("closingTime").value;

    const contact =
        document.getElementById("contact").value.trim();


    message.textContent = "Creating temple...";


    const params = new URLSearchParams({

        name,
        location,
        description,
        opening_time,
        closing_time,
        contact

    });


    try {

        const response = await fetch(
            `${API_URL}/api/temples?${params.toString()}`,
            {
                method: "POST"
            }
        );


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail || "Failed to create temple"
            );

        }

message.textContent =
    `✓ Temple created successfully. Temple ID: ${data.temple_id}`;

message.classList.add("success");

// Save temple ID for Zone Setup
localStorage.setItem(
    "yatrasetu_temple_id",
    data.temple_id
);

setTimeout(() => {

    window.location.href =
        `zone-setup.html?temple_id=${data.temple_id}`;

}, 1200);


    } catch (error) {

        console.error(error);

        message.textContent =
            error.message;

        message.classList.remove("success");

    }

});

</script>

    <footer class="site-footer">Made by <strong>Yash@Xalien</strong></footer>

</body>

</html>
